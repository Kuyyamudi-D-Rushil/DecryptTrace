version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: decrypttrace-api:prod
    restart: always
    command: bash -c "alembic upgrade head && uvicorn app.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      - DT_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DT_JWT_SECRET=${DT_JWT_SECRET}
      - DT_ADMIN_BOOTSTRAP_KEY=
      - DT_MASTER_KEY=${DT_ADMIN_BOOTSTRAP_KEY}
      - DT_AIR_GAP=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dt_network
    # Run as non-root user (decrypttrace) created in Dockerfile
    user: decrypttrace

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - dt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dt_network

volumes:
  dt_pgdata:

networks:
  dt_network:
    driver: bridge
